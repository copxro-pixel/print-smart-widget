<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRINT SMART - Test Widget</title>

<style>
body {
    font-family: Arial, sans-serif;
    padding: 20px;
    color: #333;
}
button {
    padding: 10px 18px;
    background: #0097E6;
    color: white;
    border: 0;
    border-radius: 5px;
    cursor: pointer;
}
#result {
    margin-top: 15px;
    padding: 12px;
    background: #f2f2f2;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}
</style>

<script src="https://js.jotform.com/JotFormCustomWidget.min.js"></script>
</head>

<body>

<h3>PRINT SMART!</h3>
<p>Testăm preluarea fișierelor din Jotform.</p>

<button id="testButton">Verifică fișierele</button>

<div id="result">Aștept conectarea la Jotform...</div>

<script>
const result = document.getElementById("result");

if (window.JFCustomWidget) {

    JFCustomWidget.subscribe("ready", function() {

        result.textContent =
            "Widget conectat la Jotform. Apasă Verifică fișierele.";

        document.getElementById("testButton")
            .addEventListener("click", function() {

                result.textContent = "Verific datele...";

                try {
                    JFCustomWidget.getFieldsValueByName(
                        ["fileUpload"],
                        function(data) {
                            result.textContent =
                                JSON.stringify(data, null, 2);
                            console.log("Rezultat:", data);
                        }
                    );
                } catch (error) {
                    result.textContent =
                        "Eroare: " + error.message;
                }
            });
    });

} else {
    result.textContent =
        "Widgetul trebuie deschis prin Jotform pentru testare.";
}
</script>

</body>
</html>
