<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRINT SMART</title>
<script src="https://js.jotform.com/JotFormCustomWidget.min.js"></script>
<style>
body { font-family: Arial; padding: 15px; color: #333; }
#result { background: #f2f2f2; padding: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
</style>
</head>
<body>

<h3>PRINT SMART!</h3>
<p>Testăm detectarea fișierelor încărcate.</p>
<div id="result">Aștept conectarea la Jotform...</div>

<script>
const result = document.getElementById("result");

if (window.JFCustomWidget) {
    JFCustomWidget.subscribe("ready", function() {

        result.textContent = "Widget conectat. Aștept modificarea câmpului File Upload...";

        try {
            JFCustomWidget.listenFromField("input_21", function(data) {
                result.textContent = "DATE PRIMITE:\n" + JSON.stringify(data, null, 2);
            });
        } catch (error) {
            result.textContent = "Eroare: " + error.message;
        }

    });
} else {
    result.textContent = "Widgetul nu este conectat la Jotform.";
}
</script>

</body>
</html>
